services:
  # Identity Provider (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak-idp
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/"
    command:
      - "start-dev"
      - "--import-realm"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring API Gateway (GraalVM Native Executable)
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile.native
    container_name: api-gateway
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/spring-security-realm
    ports:
      - "443:8443"
    networks:
      - internal-net
    depends_on:
      keycloak:
        condition: service_healthy
      sensitive-data-service-1:
        condition: service_healthy
      sensitive-data-service-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s # GraalVM Native Image starts in milliseconds

  # Clone 1 of Sensitive Data Service (GraalVM Native Executable)
  sensitive-data-service-1:
    build:
      context: .
      dockerfile: sensitive-data-service/Dockerfile.native
    container_name: sensitive-data-service-1
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/spring-security-realm
    volumes:
      - ./data:/app/data
    secrets:
      - db_aes_key
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s # GraalVM Native Image starts in milliseconds

  # Clone 2 of Sensitive Data Service (GraalVM Native Executable)
  sensitive-data-service-2:
    build:
      context: .
      dockerfile: sensitive-data-service/Dockerfile.native
    container_name: sensitive-data-service-2
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/spring-security-realm
    volumes:
      - ./data:/app/data
    secrets:
      - db_aes_key
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s # GraalVM Native Image starts in milliseconds

secrets:
  db_aes_key:
    file: ./secrets/db_aes_key.txt

networks:
  internal-net:
    driver: bridge
